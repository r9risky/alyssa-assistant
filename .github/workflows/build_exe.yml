name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Alyssa Windows .exe
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          SDL_AUDIODRIVER: dummy
        run: python -m pytest -q

      - name: Run build script
        run: |
          python scripts/build_exe.py

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path updater.py -Pattern 'CURRENT_VERSION = "v?([^"]+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" installer\alyssa.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash dist\Alyssa-Setup.exe -Algorithm SHA256).Hash.ToLower()
          Add-Content dist\checksums.txt "$hash *Alyssa-Setup.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alyssa-Windows-x64
          path: |
            dist/Alyssa-Windows-x64.zip
            dist/Alyssa-Setup.exe
          retention-days: 14

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Alyssa-Setup.exe
            dist/Alyssa-Windows-x64.zip
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

